<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🧠 Second Brain</title>
<!-- Puter.js: keyless, in-browser LLM for the final answer synthesis -->
<script src="https://js.puter.com/v2/"></script>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; }
  textarea, input { width: 100%; padding: 10px; border: 1px solid #8884; border-radius: 8px; font: inherit; background: transparent; color: inherit; }
  textarea { min-height: 80px; resize: vertical; }
  button { padding: 9px 16px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: progress; }
  .row { display: flex; gap: 8px; margin: 8px 0; }
  .card { border: 1px solid #8883; border-radius: 12px; padding: 16px; margin: 16px 0; }
  .muted { opacity: .65; font-size: 13px; }
  .src { font-size: 12px; opacity: .7; margin-top: 6px; }
  .answer { white-space: pre-wrap; }
  .pill { display: inline-block; background: #4f46e522; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
</style>
</head>
<body>
<h1>🧠 Second Brain <span class="pill" id="stats">…</span></h1>
<p class="muted">웹 링크나 메모를 던져두면 의미로 저장되고, 나중에 자연어로 물어보면 출처와 함께 답합니다. (키 없이 동작: Jina + 로컬 임베딩 + Puter LLM)</p>

<div class="card">
  <strong>＋ 추가하기</strong>
  <div class="row"><input id="url" placeholder="https://… (웹페이지 URL — Jina로 추출)" /></div>
  <div class="row"><textarea id="text" placeholder="또는 직접 메모/텍스트 붙여넣기"></textarea></div>
  <div class="row">
    <button id="addBtn">저장</button>
    <button id="micBtn" style="background:#7c3aed" title="브라우저 음성 인식">🎙️ 음성</button>
    <label class="pill" style="cursor:pointer">📎 파일<input id="file" type="file" accept=".md,.markdown,.txt,.html,.htm,.json,.csv,.log" multiple hidden /></label>
    <span id="addMsg" class="muted"></span>
  </div>
</div>

<div class="card">
  <strong>🔖 원클릭 클립</strong>
  <p class="muted">아래 버튼을 <b>북마크바로 드래그</b>하세요. 웹서핑 중 텍스트를 선택하고 누르면 선택분이, 없으면 그 페이지가 통째로 저장됩니다.</p>
  <div class="row"><a id="bm" href="#" style="display:inline-block;padding:8px 14px;border:1px dashed #888;border-radius:8px;text-decoration:none">🧠 Clip to Brain</a></div>
</div>

<div class="card">
  <strong>🔔 관심 주제 · 피드</strong>
  <p class="muted">RSS/Atom 주소나 웹페이지를 등록하면 매일 자동으로 새 글만 모아옵니다.</p>
  <div class="row">
    <input id="wTopic" placeholder="주제명 (예: 무료 AI 인프라)" style="flex:1" />
    <input id="wUrl" placeholder="https://…/feed.xml 또는 페이지 URL" style="flex:2" />
  </div>
  <div class="row"><button id="wAdd">등록</button><button id="collectBtn" style="background:#0891b2">지금 수집</button><span id="wMsg" class="muted"></span></div>
  <div id="watchList"></div>
</div>

<div class="card">
  <strong>📰 오늘의 다이제스트</strong>
  <div class="row"><button id="digestBtn">최근 24시간 요약 보기</button><span id="dMsg" class="muted"></span></div>
  <div id="digest" class="answer"></div>
</div>

<div class="card">
  <strong>？ 물어보기</strong>
  <div class="row"><input id="q" placeholder="예: 그때 저장한 무료 GPU 옵션 뭐였지?" /></div>
  <div class="row"><button id="askBtn">검색 + 답변</button><span id="askMsg" class="muted"></span></div>
  <div id="answer"></div>
  <div id="hits"></div>
</div>

<script>
const API = location.origin;
const $ = (id) => document.getElementById(id);

async function refreshStats() {
  try { const s = await (await fetch(API + "/stats")).json();
    $("stats").textContent = `${s.docs} docs · ${s.chunks} chunks`; } catch {}
}
refreshStats();

// bookmarklet: capture selection (or the page URL) into this brain
const BM = `javascript:(function(){var s=''+(window.getSelection?getSelection():'');var u='${API}/clip?title='+encodeURIComponent(document.title)+(s?'&text='+encodeURIComponent(s):'&url='+encodeURIComponent(location.href));window.open(u,'_blank');})();`;
$("bm").href = BM;

// file upload -> /ingest-file
$("file").onchange = async (e) => {
  const files = [...e.target.files];
  for (const f of files) {
    $("addMsg").textContent = `📎 ${f.name} 처리 중…`;
    try {
      const body = await f.text();
      const r = await (await fetch(API + "/ingest-file?name=" + encodeURIComponent(f.name), { method: "POST", body })).json();
      if (r.error) throw new Error(r.error);
      $("addMsg").textContent = `✓ ${f.name} — ${r.chunks} chunks`;
    } catch (err) { $("addMsg").textContent = "✗ " + f.name + ": " + err.message; }
  }
  refreshStats(); e.target.value = "";
};

// voice memo via the browser Web Speech API (keyless, no upload)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, finalText = "";
$("micBtn").onclick = () => {
  if (!SR) { $("addMsg").textContent = "이 브라우저는 음성 인식 미지원 (Chrome 권장)"; return; }
  if (rec) { rec.stop(); return; }              // toggle off
  rec = new SR(); finalText = $("text").value ? $("text").value + " " : "";
  rec.lang = "ko-KR"; rec.interimResults = true; rec.continuous = true;
  rec.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) finalText += t + " "; else interim += t;
    }
    $("text").value = (finalText + interim).trim();
  };
  rec.onend = () => { rec = null; $("micBtn").textContent = "🎙️ 음성"; $("addMsg").textContent = finalText.trim() ? "받아쓰기 완료 — 저장 누르기" : ""; };
  rec.onerror = (e) => { $("addMsg").textContent = "음성 오류: " + e.error; };
  $("micBtn").textContent = "⏹️ 중지"; $("addMsg").textContent = "듣는 중…"; rec.start();
};

$("addBtn").onclick = async () => {
  const url = $("url").value.trim(), text = $("text").value.trim();
  if (!url && !text) return;
  $("addBtn").disabled = true; $("addMsg").textContent = "처리 중…";
  try {
    const r = await (await fetch(API + "/ingest", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: url || undefined, text: text || undefined }),
    })).json();
    if (r.error) throw new Error(r.error);
    $("addMsg").textContent = `✓ "${r.title}" — ${r.chunks} chunks 저장됨`;
    $("url").value = ""; $("text").value = ""; refreshStats();
  } catch (e) { $("addMsg").textContent = "✗ " + e.message; }
  $("addBtn").disabled = false;
};

// ---- watches ----
async function loadWatches() {
  const { watches } = await (await fetch(API + "/watches")).json();
  $("watchList").innerHTML = watches.length
    ? watches.map((w) => `<div class="src">• <b>${w.topic}</b> <span class="muted">${w.type} · ${w.seenCount}개 추적</span> <a href="#" data-id="${w.id}" class="del">삭제</a></div>`).join("")
    : "<div class='muted'>아직 등록된 주제가 없어요.</div>";
  document.querySelectorAll(".del").forEach((a) => a.onclick = async (e) => {
    e.preventDefault();
    await fetch(API + "/watches?id=" + a.dataset.id, { method: "DELETE" });
    loadWatches();
  });
}
loadWatches();

$("wAdd").onclick = async () => {
  const topic = $("wTopic").value.trim(), url = $("wUrl").value.trim();
  if (!url) return;
  $("wMsg").textContent = "등록 중…";
  await fetch(API + "/watches", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ topic, url }) });
  $("wTopic").value = ""; $("wUrl").value = ""; $("wMsg").textContent = "✓ 등록됨";
  loadWatches();
};

$("collectBtn").onclick = async () => {
  $("wMsg").textContent = "수집 중… (피드 개수만큼 걸려요)";
  try {
    const r = await (await fetch(API + "/collect", { method: "POST" })).json();
    $("wMsg").textContent = `✓ 새 항목 ${r.total}건 수집`;
    refreshStats(); loadWatches();
  } catch (e) { $("wMsg").textContent = "✗ " + e.message; }
};

$("digestBtn").onclick = async () => {
  $("dMsg").textContent = "불러오는 중…";
  const d = await (await fetch(API + "/digest?hours=24")).json();
  $("dMsg").textContent = `${d.count}건 · ${d.topics}개 주제`;
  // minimal markdown -> html
  $("digest").innerHTML = d.markdown
    .replace(/^# (.*)$/gm, "<h2>$1</h2>")
    .replace(/^## (.*)$/gm, "<h3>$1</h3>")
    .replace(/\[원문\]\(([^)]+)\)/g, '<a href="$1" target="_blank">원문</a>')
    .replace(/\*\*(.*?)\*\*/g, "<b>$1</b>")
    .replace(/^- /gm, "• ").replace(/\n/g, "<br>");
};

$("askBtn").onclick = async () => {
  const query = $("q").value.trim();
  if (!query) return;
  $("askBtn").disabled = true; $("askMsg").textContent = "검색 중…";
  $("answer").innerHTML = ""; $("hits").innerHTML = "";
  try {
    const { hits } = await (await fetch(API + "/search", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query, k: 5 }),
    })).json();

    if (!hits.length) { $("askMsg").textContent = "저장된 내용이 없어요."; $("askBtn").disabled = false; return; }

    // Show retrieved sources immediately.
    $("hits").innerHTML = "<div class='muted' style='margin-top:12px'>참고한 조각:</div>" +
      hits.map((h, i) => `<div class="src">[${i + 1}] ${h.title} (${(h.score).toFixed(2)})</div>`).join("");

    // Synthesize an answer with Puter (keyless, in-browser LLM).
    $("askMsg").textContent = "답변 생성 중…";
    const context = hits.map((h, i) => `[${i + 1}] (${h.title})\n${h.text}`).join("\n\n");
    const prompt = `아래 발췌만 근거로 질문에 한국어로 답하고, 문장 끝에 [번호] 출처를 달아줘. 근거가 없으면 모른다고 해.\n\n질문: ${query}\n\n발췌:\n${context}`;
    const resp = await puter.ai.chat(prompt, { model: "gpt-4o-mini" });
    $("answer").innerHTML = `<div class="answer">${(resp?.message?.content || resp).toString()}</div>`;
    $("askMsg").textContent = "";
  } catch (e) {
    $("askMsg").textContent = "✗ " + e.message + " (Puter 답변 단계는 브라우저에서만 동작)";
  }
  $("askBtn").disabled = false;
};
</script>
</body>
</html>
